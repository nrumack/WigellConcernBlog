spring.application.name=WigellConcernBlog
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:blogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username = admin
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Oauth2 configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/WigellConcernBlog
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/WigellConcernBlog/protocol/openid-connect/certs

jwt.auth.converter.resource-id.name=myclient
jwt.auth.converter.principle-attribute=preferred_username

# Keycloak
keycloak.realm=WigellConcernBlog
keycloak.auth-server-url=https://localhost:8081
keycloak.resource=spring-boot-client
keycloak.credentials.secret=BlogUser
keycloak.ssl-required=external
keycloak.use-resource-role-mappings=true

